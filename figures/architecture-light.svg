<text x="482.0" y="158.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" opacity="1.0">LLEP DATA</text>
<text x="482.0" y="173.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" opacity="1.0">over UDP,</text>
<text x="482.0" y="188.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400" opacity="1.0">unicast fan-out</text>
<path d="M414.0,210.0 C483.0,210.0 483.0,283.0 552.0,283.0" fill="none" stroke="#a8a69e" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<rect x="552.0" y="272.0" width="104.0" height="22.0" rx="5" fill="#ffffff" fill-opacity="0.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="562.0" y="287.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" opacity="1.0">receiver 2</text>
<path d="M414.0,210.0 C483.0,210.0 483.0,313.0 552.0,313.0" fill="none" stroke="#a8a69e" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<rect x="552.0" y="302.0" width="104.0" height="22.0" rx="5" fill="#ffffff" fill-opacity="0.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="562.0" y="317.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" opacity="1.0">receiver N</text>
<text x="28.0" y="284.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">The producer creates the ingress SHM; the Sender attaches.</text>
<text x="28.0" y="300.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">A full ring returns Full on publish; nothing is overwritten.</text>
<text x="28.0" y="316.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">Packets carry a session_id and a sequence that grows by 1.</text>
<text x="680.0" y="284.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">The Receiver creates the egress SHM;</text>
<text x="680.0" y="300.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">the consumer attaches. Malformed packets</text>
<text x="680.0" y="316.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">and events that do not fit are dropped</text>
<text x="680.0" y="332.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">and counted.</text>
</svg>
