<rect x="797.6" y="198.0" width="12.4" height="14.0" rx="2" fill="#eb6834" fill-opacity="0.25"/>
<text x="690.0" y="230.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">in: try_publish (copy)</text>
<text x="690.0" y="244.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">out: try_acquire (view)</text>
<rect x="844.0" y="150.0" width="88.0" height="104.0" rx="6" fill="#ffffff" fill-opacity="1.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="854.0" y="176.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" opacity="1.0">Consumer</text>
<text x="854.0" y="192.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" opacity="1.0">application</text>
<text x="854.0" y="212.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">reads events</text>
<text x="854.0" y="227.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">in order</text>
<path d="M125.0,202.0 C135.5,202.0 135.5,202.0 146.0,202.0" fill="none" stroke="#a8a69e" stroke-width="1.5" opacity="1.0" marker-end="url(#arrow)"/>
