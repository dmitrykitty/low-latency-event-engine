<text x="562.0" y="212.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">decode, validate</text>
<text x="562.0" y="227.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">gap / dup detect</text>
