<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img">
<title>Event path: producer, ingress ring, Sender, UDP, Receiver, egress ring, consumer</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a69e"/></marker></defs>
<rect width="960" height="352" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" opacity="1.0">Event path: shared memory → UDP → shared memory</text>
<text x="24.0" y="52.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" opacity="1.0">One producer and one consumer per ring; one LLEP DATA packet per event; the Sender fans each packet out to every receiver.</text>
